name: Release

# Tagging `v*` builds the CLI for every supported host and attaches the binaries
# to a GitHub Release. A `cargo install` needs a Rust toolchain; a downloadable
# binary does not — which is the difference between "interesting repo" and
# "tool people actually run".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A job with no available runner queues until GitHub's 24h ceiling, then
    # cancels the whole run. That is exactly how v0.2.0 and v0.3.1 died: the
    # Intel-mac job sat in the queue for a day and `Publish release` was
    # skipped, so neither tag ever produced a release. A build that cannot get
    # a runner should fail in twenty minutes and say so.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin,      ext: ""     }
          # Cross-compiled from the Apple Silicon runner rather than built on a
          # `macos-13` one: that image was retired, and asking for it is what
          # hung the two previous releases. The Apple toolchain targets both
          # architectures from either host, so this is a target flag, not a
          # different machine.
          - { os: macos-latest,  target: x86_64-apple-darwin,       ext: ""     }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  ext: ""     }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite is vendored (`bundled`), so this compiles SQLite from source —
      # no system libsqlite3 needed on any runner.
      - name: Build
        run: cargo build --release --bin kedge --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/kedge${{ matrix.ext }}"
          test -f "$bin" || { echo "::error::binary not found at $bin"; exit 1; }
          mkdir -p dist
          name="kedge-${{ github.ref_name }}-${{ matrix.target }}"
          # Ship the license with the binary: BSL is source-available, not OSI
          # open source, and recipients need the terms in the same archive.
          cp LICENSE README.md "$bin" dist/ 2>/dev/null || cp "$bin" dist/
          cd dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "../$name.zip" ./* >/dev/null
          else
            tar czf "../$name.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kedge-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Every release used to carry the same install blurb and an autogenerated
      # commit list, so no release ever said what it was *for*. The annotated
      # tag already has that text; use it rather than writing it twice.
      #
      # Read through the API, not `git tag -l --format='%(contents)'`. That was
      # the first attempt and it silently produced the *commit* message instead:
      # actions/checkout leaves a lightweight tag in the local clone, and
      # `%(contents)` on a lightweight tag falls back to the commit it points at.
      # The v0.4.0 draft went out with a CI commit message as its release notes
      # and nothing failed. The API asks for the tag object directly, so there is
      # no fallback to be fooled by.
      - name: Assemble release notes from the tag annotation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" -q '.object.sha')
          type=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" -q '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; release notes come from an annotated tag's message" >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/tags/$obj" -q '.message' > TAG_MESSAGE.md
          # An empty or one-line message means the lookup degraded somehow. Fail
          # rather than publish a release that says nothing.
          if [ "$(wc -l < TAG_MESSAGE.md)" -lt 3 ]; then
            echo "::error::tag annotation for $TAG is empty or too short to be release notes" >&2
            cat TAG_MESSAGE.md >&2
            exit 1
          fi
          {
            cat TAG_MESSAGE.md
            cat <<'BOILERPLATE'

          ## Install

          Download the archive for your platform below, extract, and put `kedge` on your `PATH`.
          Verify against `SHA256SUMS` before running.

          From source:

          ```bash
          cargo install --git https://github.com/nlj3/kedge --bin kedge
          ```

          ## Licensing

          Kedge is released under the **Business Source License 1.1**: free for
          non-commercial use, evaluation, and internal non-revenue use. Commercial
          use requires a license. Converts to Apache 2.0 on the Change Date.
          BOILERPLATE
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Re-tagging has to actually re-release, and by default it does not.
      #
      # action-gh-release, when a release already exists for the tag, reuses the
      # existing record and only swaps the assets. Its own log says so:
      #
      #   ↪️ Using release 360201650 for tag v0.4.0 instead of duplicate draft
      #   🧹 Removing duplicate draft release 360243705 for tag v0.4.0...
      #
      # It built a new draft carrying the correct notes, then threw that one
      # away and kept the old record's body. So v0.4.0 was rebuilt twice with
      # fresh binaries and stale release notes, and the job passed both times.
      #
      # Clearing the draft first makes a re-tag idempotent. The `draft==true`
      # filter is the whole safety of this step: a published release is a thing
      # people have downloaded and linked, and must never be deleted by CI.
      - name: Clear any stale DRAFT release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/releases" --paginate \
                  --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          if [ -z "$ids" ]; then
            echo "no existing draft for $TAG; nothing to clear"
            exit 0
          fi
          for id in $ids; do
            echo "deleting stale draft release $id for $TAG"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true # reviewed before it goes public
          body_path: RELEASE_NOTES.md
