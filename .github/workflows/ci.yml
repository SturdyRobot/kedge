name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

  # `cargo *--workspace` skips the excluded crates (see root Cargo.toml), so the
  # wasm demo — which ships on the public site — would rot silently. This job is
  # the guard: kedge-core must stay wasm-clean, and kedge-web must still build.
  wasm:
    name: wasm · core stays portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Guards the target-gated tokio/uuid deps and web-time Instant: if someone
      # reintroduces a native-only dependency into core, this fails here rather
      # than in the browser.
      - name: kedge-core builds for wasm32
        run: cargo build -p kedge-core --target wasm32-unknown-unknown

      - name: kedge-web (excluded crate) builds for wasm32
        run: cargo build --manifest-path crates/kedge-web/Cargo.toml --target wasm32-unknown-unknown --release

      - name: kedge-web clippy
        run: cargo clippy --manifest-path crates/kedge-web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

  # nlj.dev publishes a command and a table of figures and tells readers the
  # table regenerates from the command. That is a promise about a *clean clone*,
  # not about my laptop, and until this job existed nothing checked it. The
  # crates it needs sat on a branch for two days while the site linked to main.
  #
  # Deliberately unlike the `test` job above:
  #   - no cargo cache, so a dependency that only resolves from a warm ~/.cargo
  #     fails here instead of failing for a stranger;
  #   - the published command verbatim, not a `cargo test` that happens to cover
  #     the same code;
  #   - a byte diff against the checked-in golden, so behaviour cannot drift
  #     away from the published figures without going red.
  #
  # What it does not do: reach into the website repo. It pins the numbers at the
  # source, so a change has to update the golden in the same commit, which is
  # where the site gets remembered. That is a smaller promise than "docs can
  # never be stale" and it is the one that is actually kept.
  repro:
    name: reproducibility · published command on a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The only documented prerequisite. If anything else turns out to be
      # required, this job is where that gets discovered.
      - uses: dtolnay/rust-toolchain@stable

      - name: Run the command published on nlj.dev
        shell: bash # for pipefail; the default `bash -e` would swallow a cargo failure
        run: cargo run -p kedge-bench --example adversarial_report | tee adversarial_report.txt

      - name: Output must match the figures the site quotes
        run: diff -u crates/kedge-bench/tests/golden/adversarial_report.txt adversarial_report.txt

      # The golden diff catches behaviour drifting away from the docs. It does
      # not catch the docs drifting away from behaviour: the README table is
      # hand-written prose, and editing a digit there would pass everything
      # above. Assert each result row of the golden appears verbatim in the
      # README, so the two cannot disagree in either direction.
      - name: README must quote those same rows
        shell: bash
        run: |
          status=0
          while IFS= read -r row; do
            if ! grep -Fqx "$row" README.md; then
              echo "::error file=README.md::README is missing this row from the golden report: $row"
              status=1
            fi
          done < <(grep -E '^  (no protection|kedge-skill manifest|deny everything) ' \
                     crates/kedge-bench/tests/golden/adversarial_report.txt)
          exit $status

      # Uploaded whether or not the diff passed, so a failure can be read
      # without re-running anything.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-report
          path: adversarial_report.txt
          if-no-files-found: error

  # Supply chain: fail the build on a RustSec *vulnerability* against anything in
  # Cargo.lock. This action, unlike a bare `cargo audit`, also fails on
  # unmaintained-crate advisories — so those are ignored explicitly (see
  # audit.toml for the rationale) to keep the gate about real vulnerabilities.
  audit:
    name: supply chain · cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # number_prefix: unmaintained, transitive via indicatif, no vuln.
          ignore: RUSTSEC-2025-0119
