version: 2
updates:
  # Rust dependencies across the workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch routine patch/minor bumps into a single PR to cut review noise.
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  # Keep the GitHub Actions in CI/release pinned and current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
